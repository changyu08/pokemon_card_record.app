plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.co.ptcg.record'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.co.ptcg.record'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
